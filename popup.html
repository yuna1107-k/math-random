<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>math-random</title>
    <style>
      body {
        width: 220px;
        font-family: system-ui, sans-serif;
        padding: 12px;
      }
      label {
        display: block;
        font-size: 12px;
        color: #555;
        margin-bottom: 4px;
      }
      select {
        width: 100%;
        padding: 4px;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        padding: 8px;
        margin-top: 10px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <label for="radix-mode">基数モード</label>
    <select id="radix-mode">
      <option value="random">ランダム（2〜36）</option>
      <option value="2">2進固定</option>
      <option value="8">8進固定</option>
      <option value="16">16進固定</option>
    </select>
    <button id="toggle-btn">変換する</button>
    <script src="popup.js"></script>
  </body>
</html>
